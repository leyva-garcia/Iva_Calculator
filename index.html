<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>newPercentage</title>
</head>

<body>
    

    <div id="container">
      <header>
        <h1>Calculadora IVA</h1>
      </header>

      <form id="percentage-form">
        <label for="input-num">Total: </label>
        <input type="number" id="input-num" required>

        <label for="input-percentage">Otro %</label>
        <input type="number" id="input-percentage" required>
      </form>

      <button id="calculate-btn">Calcular</button>

      <div id="results">
        <div id="plus-iva-total"><strong>+ </strong>IVA 22%: </div>
        <div id="iva-total">IVA 22%: </div>
        <div id="percentage-result">Resultado del %</div>
        
        <div id="add-result">Mas el %</div>
      </div>

    </div>


    <script src="index.js"></script>
</body>
</html>
