<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>newPercentage</title>
</head>

<body>
    <header>Calculadora IVA</header>

    <div id="container">

      <form id="percentage-form">
        <label for="input-num">Enter a number</label>
        <input type="number" id="input-num" required>

        <label for="input-percentage">Enter %</label>
        <input type="number" id="input-percentage" required>
      </form>

      <button id="calculate-btn">Calculate</button>

      <div id="results">
        <div id="percentage-result">Persentage Result</div>
        <div id="substraction-result">Substraction Result</div>
        <div id="add-result">Add Result</div>
      </div>

    </div>


    <script src="index.js"></script>
</body>
</html>
