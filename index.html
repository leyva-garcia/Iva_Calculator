<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <title>newPercentage</title>
</head>

<body>
    

    <div id="container">
      <header>
        <h1>CaT...culadora IVA</h1>
      </header>

      <form id="percentage-form">
        
          <label for="input-num">Número: </label>
          <input type="number" id="input-num" required>
        
       
        
          <label for="input-percentage">Otro %</label>
          <input type="number" id="input-percentage" required>
          </form>
       

       
        <button id="calculate-btn">Calcular</button>
        <button id="reset-btn">Reset</button>
       
      

      <div id="results">
        <div id="plus-iva-total">+ IVA 22%: </div>
        <div id="iva-total"></div>

        <div id="plus-iva-min">+ IVA 10%: </div>
        <div id="iva-min"></div>
        <div id="percentage-result">Resultado del Otro %</div>
        
        <div id="add-result">Mas el Otro %</div>
      </div>

    </div>


    <script src="index.js"></script>
</body>
</html>
